[package]
name = "lumen-settings"
description = "Lumen settings and editor app (separate process, frees its memory on close)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lumen-ipc = { version = "0.1.0", path = "../../../crates/lumen-ipc" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
