[package]
name = "lumen-win"
description = "Windows API wrappers: wallpaper, accent, dark mode, fullscreen, hotkeys."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
lumen-theme = { version = "0.1.0", path = "../lumen-theme" }
thiserror = "2.0.21"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Accessibility", "Win32_System_Threading", "Win32_UI_Shell_Common", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
windows-registry = "0.100.0"
