[package]
name = "lumen-core"
description = "Always-on Lumen service: state, preview/commit, governor, tray, IPC server."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
lumen-theme.workspace = true
lumen-win.workspace = true
lumen-render.workspace = true
lumen-widgets.workspace = true
lumen-ipc.workspace = true
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
tokio = { version = "1.54.1", features = ["test-util"] }
