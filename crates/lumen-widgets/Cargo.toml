[package]
name = "lumen-widgets"
description = "Widget file parser, Luau runtime and built-in widgets."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "bmp"] }
lumen-ipc = { version = "0.1.0", path = "../lumen-ipc" }
lumen-render = { version = "0.1.0", path = "../lumen-render" }
lumen-theme = { version = "0.1.0", path = "../lumen-theme" }
lumen-win = { version = "0.1.0", path = "../lumen-win" }
mlua = { version = "0.12.2", features = ["luau"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tracing = "0.1.44"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Performance", "Win32_System_Time", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_WinRT", "Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_UI_Input_KeyboardAndMouse"] }
