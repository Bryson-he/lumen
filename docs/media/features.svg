<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Six things Lumen does: themes from a wallpaper, widgets you can take apart, meters your way, Home Assistant, scripts with your say-so, and a gallery">
  <title>What Lumen does</title>
  <style>
    text { font-family: "Segoe UI Variable", "Segoe UI", Inter, system-ui, sans-serif; }
    .card { fill: #14171c; stroke: #2a2f38; }
    .head { fill: #eef1f4; font-size: 21px; font-weight: 600; }
    .body { fill: #a3a9b4; font-size: 14.5px; }
    .ink { fill: #eef1f4; } .soft { fill: #a3a9b4; }
    .a { fill: #56d5ff; } .b { fill: #ffb692; } .c { fill: #abc8f7; } .d { fill: #2a3138; }
    .sa { stroke: #56d5ff; } .sb { stroke: #ffb692; } .sc { stroke: #abc8f7; } .sd { stroke: #2a3138; }
    .sweep { animation: sweep 5s ease-in-out infinite alternate; }
    @keyframes sweep { from { stroke-dashoffset: 150 } to { stroke-dashoffset: 40 } }
    .blink { animation: blink 3.2s steps(1) infinite; }
    @keyframes blink { 0%, 55% { opacity: 1 } 56%, 100% { opacity: .25 } }
    .grow { animation: grow 6s ease-in-out infinite alternate; }
    @keyframes grow { from { width: 46px } to { width: 150px } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- 1 · Themes from a wallpaper -->
  <g transform="translate(0 0)">
    <rect class="card" x="0.5" y="0.5" width="386" height="250" rx="18"/>
    <rect x="24" y="24" width="120" height="68" rx="10" fill="#0e4c6b"/>
    <ellipse cx="104" cy="52" rx="44" ry="26" fill="#7fe3d0" opacity=".55"/>
    <path d="M160 58 h26 m-8 -8 l8 8 l-8 8" fill="none" stroke="#a3a9b4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="a" x="204" y="36" width="34" height="34" rx="8"/><rect class="c" x="244" y="36" width="34" height="34" rx="8"/>
    <rect class="b" x="284" y="36" width="34" height="34" rx="8"/><rect class="d" x="324" y="36" width="34" height="34" rx="8" stroke="#3a414b"/>
    <text class="head" x="24" y="136">A theme from any wallpaper</text>
    <text class="body" x="24" y="164">Eight colour roles made from the picture,</text>
    <text class="body" x="24" y="184">in four flavours, light or dark. Try one on</text>
    <text class="body" x="24" y="204">your real desktop for 15 seconds, then keep</text>
    <text class="body" x="24" y="224">it or let it go back by itself.</text>
  </g>

  <!-- 2 · Widgets you can take apart -->
  <g transform="translate(407 0)">
    <rect class="card" x="0.5" y="0.5" width="386" height="250" rx="18"/>
    <rect x="24" y="24" width="150" height="68" rx="10" fill="#0d1014" stroke="#2a2f38"/>
    <text class="soft" x="36" y="46" font-size="11">Saturday 14 Nov</text>
    <text class="ink" x="36" y="78" font-size="28" font-weight="600">6:05</text>
    <rect x="30" y="54" width="92" height="32" rx="4" fill="none" stroke="#56d5ff" stroke-dasharray="4 3"/>
    <rect class="a" x="118" y="82" width="8" height="8" rx="2"/><rect class="a" x="26" y="50" width="8" height="8" rx="2"/>
    <rect x="190" y="24" width="172" height="68" rx="10" fill="#0d1014" stroke="#2a2f38"/>
    <text x="202" y="45" font-size="11" fill="#ffb692" font-family="Consolas, monospace">- id: time</text>
    <text x="202" y="62" font-size="11" fill="#a3a9b4" font-family="Consolas, monospace">  text: "{clock.time}"</text>
    <text x="202" y="79" font-size="11" fill="#a3a9b4" font-family="Consolas, monospace">  fit: true</text>
    <text class="head" x="24" y="136">Widgets you can take apart</text>
    <text class="body" x="24" y="164">Every line of text, bar, ring and icon can be</text>
    <text class="body" x="24" y="184">moved, resized, restyled or hidden. Design</text>
    <text class="body" x="24" y="204">with the mouse, or edit the same widget as</text>
    <text class="body" x="24" y="224">a readable YAML file.</text>
  </g>

  <!-- 3 · Meters your way -->
  <g transform="translate(814 0)">
    <rect class="card" x="0.5" y="0.5" width="386" height="250" rx="18"/>
    <circle cx="58" cy="58" r="28" fill="none" class="sd" stroke-width="8" stroke-dasharray="132 176" stroke-linecap="round" transform="rotate(135 58 58)"/>
    <circle cx="58" cy="58" r="28" fill="none" class="sa sweep" stroke-width="8" stroke-dasharray="132 176" stroke-dashoffset="90" stroke-linecap="round" transform="rotate(135 58 58)"/>
    <g transform="translate(108 34)">
      <rect class="b" width="16" height="12" rx="3"/><rect class="b" x="21" width="16" height="12" rx="3"/><rect class="b" x="42" width="16" height="12" rx="3"/>
      <rect class="b blink" x="63" width="16" height="12" rx="3"/><rect class="d" x="84" width="16" height="12" rx="3"/><rect class="d" x="105" width="16" height="12" rx="3"/>
      <rect class="d" x="126" width="16" height="12" rx="3"/><rect class="d" x="147" width="16" height="12" rx="3"/><rect class="d" x="168" width="16" height="12" rx="3"/><rect class="d" x="189" width="16" height="12" rx="3"/>
      <rect class="d" y="28" width="205" height="6" rx="3"/><rect class="c grow" y="28" width="90" height="6" rx="3"/>
      <polyline points="0,62 26,56 52,60 78,46 104,52 130,40 156,48 182,38 205,44" fill="none" class="sa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
    </g>
    <text class="head" x="24" y="136">Meters your way</text>
    <text class="body" x="24" y="164">Any level can be a bar, a row of blocks,</text>
    <text class="body" x="24" y="184">a ring, a dial or a graph. Switch between</text>
    <text class="body" x="24" y="204">them in one click, and colour them to warn</text>
    <text class="body" x="24" y="224">you when a number gets too high.</text>
  </g>

  <!-- 4 · Home Assistant -->
  <g transform="translate(0 270)">
    <rect class="card" x="0.5" y="0.5" width="386" height="250" rx="18"/>
    <rect x="24" y="22" width="338" height="76" rx="10" fill="#0d1014" stroke="#2a2f38"/>
    <circle class="a" cx="42" cy="44" r="5"/><text class="ink" x="56" y="49" font-size="13">Neon light</text><text class="soft" x="348" y="49" font-size="13" text-anchor="end">On</text>
    <circle cx="42" cy="68" r="4.5" fill="none" stroke="#5b636f" stroke-width="1.5"/><text class="ink" x="56" y="73" font-size="13">Desk lamp</text><text class="soft" x="348" y="73" font-size="13" text-anchor="end">Off</text>
    <text class="ink" x="36" y="91" font-size="12" opacity="0"> </text>
    <text class="head" x="24" y="136">Home Assistant built in</text>
    <text class="body" x="24" y="164">Connect once, then tick lights, plugs, scenes</text>
    <text class="body" x="24" y="184">and sensors from a list. They land on your</text>
    <text class="body" x="24" y="204">desktop as a panel: a click switches a light,</text>
    <text class="body" x="24" y="224">a reading stays up to date.</text>
  </g>

  <!-- 5 · Scripts with your say-so -->
  <g transform="translate(407 270)">
    <rect class="card" x="0.5" y="0.5" width="386" height="250" rx="18"/>
    <rect x="24" y="22" width="338" height="76" rx="10" fill="#0d1014" stroke="#2a2f38"/>
    <text x="38" y="46" font-size="12" fill="#a3a9b4">This script asks to:</text>
    <circle class="b" cx="44" cy="62" r="3"/><text class="ink" x="56" y="66" font-size="12.5">Go online</text>
    <rect x="232" y="56" width="116" height="30" rx="8" fill="#56d5ff"/><text x="290" y="76" font-size="12.5" font-weight="600" fill="#06202b" text-anchor="middle">Allow it to run</text>
    <text class="head" x="24" y="136">Scripts, with your say-so</text>
    <text class="body" x="24" y="164">A widget can carry a small Luau script that</text>
    <text class="body" x="24" y="184">reads files, calls a web API or runs a program.</text>
    <text class="body" x="24" y="204">It says what it needs, and never runs until</text>
    <text class="body" x="24" y="224">you have read that and allowed it.</text>
  </g>

  <!-- 6 · Light on your PC -->
  <g transform="translate(814 270)">
    <rect class="card" x="0.5" y="0.5" width="386" height="250" rx="18"/>
    <text class="ink" x="24" y="72" font-size="44" font-weight="700" letter-spacing="-1">0.02%</text>
    <text class="soft" x="182" y="54" font-size="12.5">CPU at idle</text>
    <text class="soft" x="182" y="72" font-size="12.5">with three widgets</text>
    <rect class="d" x="24" y="88" width="338" height="5" rx="2.5"/><rect class="a" x="24" y="88" width="5" height="5" rx="2.5"/>
    <text class="head" x="24" y="136">Light, and out of the way</text>
    <text class="body" x="24" y="164">About 70 MB of memory. Nothing is drawn</text>
    <text class="body" x="24" y="184">while a fullscreen game runs, nothing is</text>
    <text class="body" x="24" y="204">injected into other programs, and it never</text>
    <text class="body" x="24" y="224">keeps your screens on or your PC awake.</text>
  </g>
</svg>
